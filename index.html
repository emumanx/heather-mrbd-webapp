<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heather MRBD Test</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 600px;
            height: 600px;
            overflow: hidden;
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 600px;
            height: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #e879f9;
        }
        p {
            font-size: 24px;
            color: #a1a1aa;
            text-align: center;
            margin-bottom: 30px;
        }
        #status {
            font-size: 20px;
            color: #34d399;
            padding: 12px 24px;
            border: 2px solid #34d399;
            border-radius: 12px;
        }
        #counter {
            font-size: 72px;
            font-weight: 800;
            color: #fbbf24;
            margin: 20px 0;
        }
        .hint {
            font-size: 16px;
            color: #52525b;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Heather</h1>
        <p>MRBD Pipeline Test</p>
        <div id="status">Connected</div>
        <div id="counter">0</div>
        <div class="hint">Swipe / pinch to interact</div>
    </div>
    <script>
        // Basic input handling - arrow keys (swipe gestures map to these)
        let count = 0;
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status');

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                count++;
                counterEl.textContent = count;
                statusEl.textContent = 'Tap registered';
                statusEl.style.color = '#fbbf24';
                statusEl.style.borderColor = '#fbbf24';
                setTimeout(() => {
                    statusEl.textContent = 'Connected';
                    statusEl.style.color = '#34d399';
                    statusEl.style.borderColor = '#34d399';
                }, 1000);
            } else if (e.key === 'ArrowUp') {
                count += 10;
                counterEl.textContent = count;
            } else if (e.key === 'ArrowDown') {
                count = Math.max(0, count - 10);
                counterEl.textContent = count;
            }
        });

        // Log that we loaded
        console.log('Heather MRBD Test App loaded');
    </script>
</body>
</html>
