<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heather Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 600px;
            height: 600px;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 600px;
            height: 600px;
        }
        #title {
            font-size: 28px;
            font-weight: 700;
            color: #e879f9;
            margin-bottom: 8px;
        }
        #score {
            font-size: 20px;
            color: #fbbf24;
            margin-bottom: 8px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 8px;
            background: #111;
        }
        #hint {
            font-size: 14px;
            color: #52525b;
            margin-top: 10px;
        }
        #overlay {
            position: absolute;
            width: 600px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
        }
        #overlay h2 {
            font-size: 36px;
            color: #e879f9;
            margin-bottom: 12px;
        }
        #overlay p {
            font-size: 18px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }
        #overlay .blink {
            font-size: 20px;
            color: #34d399;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h2>🐍 Heather Snake</h2>
        <p>Swipe to move</p>
        <p>Tap to start</p>
        <p class="blink">Press Enter</p>
    </div>
    <div id="game-container">
        <div id="title">🐍 Heather Snake</div>
        <div id="score">Score: 0</div>
        <canvas id="canvas" width="500" height="500"></canvas>
        <div id="hint">Swipe ⬆️⬇️⬅️➡️ to steer · Tap to restart</div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');

        const GRID = 20;
        const COLS = canvas.width / GRID;
        const ROWS = canvas.height / GRID;

        let snake, dir, nextDir, food, score, running, gameLoop, speed;

        // Web Audio API for sound effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    audioCtx = null;
                }
            }
        }
        function beep(freq, duration, type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'square';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playEatSound() {
            beep(800, 0.1, 'square');
            setTimeout(() => beep(1200, 0.08, 'square'), 80);
        }

        function playCrashSound() {
            beep(200, 0.15, 'sawtooth');
            setTimeout(() => beep(120, 0.2, 'sawtooth'), 100);
        }

        function playStartSound() {
            beep(600, 0.08, 'square');
            setTimeout(() => beep(800, 0.08, 'square'), 80);
            setTimeout(() => beep(1000, 0.1, 'square'), 160);
        }

        function reset() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            speed = 150;
            placeFood();
            scoreEl.textContent = 'Score: 0';
            running = true;
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
            // Don't place on snake
            for (let s of snake) {
                if (s.x === food.x && s.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines (subtle)
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID, 0);
                ctx.lineTo(i * GRID, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID);
                ctx.lineTo(canvas.width, i * GRID);
                ctx.stroke();
            }

            // Food - glowing apple
            const fx = food.x * GRID + GRID/2;
            const fy = food.y * GRID + GRID/2;
            const pulse = Math.sin(Date.now() / 200) * 2;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(fx, fy, GRID/2 - 2 + pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath();
            ctx.arc(fx - 3, fy - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            // Snake
            for (let i = 0; i < snake.length; i++) {
                const s = snake[i];
                const x = s.x * GRID;
                const y = s.y * GRID;
                if (i === 0) {
                    // Head
                    ctx.fillStyle = '#e879f9';
                    ctx.fillRect(x + 1, y + 1, GRID - 2, GRID - 2);
                    ctx.fillStyle = '#f0abfc';
                    ctx.fillRect(x + 3, y + 3, GRID - 6, GRID - 6);
                    // Eyes
                    ctx.fillStyle = '#0a0a0a';
                    const eyeOffset = 4;
                    if (dir.x === 1) {
                        ctx.fillRect(x + GRID - 6, y + 4, 3, 3);
                        ctx.fillRect(x + GRID - 6, y + GRID - 7, 3, 3);
                    } else if (dir.x === -1) {
                        ctx.fillRect(x + 3, y + 4, 3, 3);
                        ctx.fillRect(x + 3, y + GRID - 7, 3, 3);
                    } else if (dir.y === 1) {
                        ctx.fillRect(x + 4, y + GRID - 6, 3, 3);
                        ctx.fillRect(x + GRID - 7, y + GRID - 6, 3, 3);
                    } else {
                        ctx.fillRect(x + 4, y + 3, 3, 3);
                        ctx.fillRect(x + GRID - 7, y + 3, 3, 3);
                    }
                } else {
                    // Body - gradient from head color to tail
                    const t = i / snake.length;
                    const r = Math.round(232 - t * 100);
                    const g = Math.round(121 - t * 60);
                    const b = Math.round(249 - t * 80);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x + 2, y + 2, GRID - 4, GRID - 4);
                }
            }
        }

        function update() {
            if (!running) return;

            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Wall collision
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
            }

            // Self collision
            for (let s of snake) {
                if (s.x === head.x && s.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Score: ' + score;
                playEatSound();
                placeFood();
                // Speed up slightly
                if (speed > 60) speed -= 3;
                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(gameLoop);
            playCrashSound();
            overlay.querySelector('h2').textContent = '💀 Game Over';
            overlay.querySelector('p:nth-of-type(1)').textContent = 'Score: ' + score;
            overlay.querySelector('p:nth-of-type(2)').textContent = 'Tap to play again';
            overlay.querySelector('.blink').textContent = 'Press Enter';
            overlay.style.display = 'flex';
        }

        function startGame() {
            initAudio();
            playStartSound();
            overlay.style.display = 'none';
            reset();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function drawIdle() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Draw a preview snake
            ctx.fillStyle = '#e879f9';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(100 + i * GRID + 2, 200 + 2, GRID - 4, GRID - 4);
            }
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(250, 210, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        drawIdle();

        // Input - arrow keys map to swipe gestures on MRBD
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!running) {
                    startGame();
                }
                return;
            }
            if (!running) return;
            switch(e.key) {
                case 'ArrowUp':
                    if (dir.y !== 1) nextDir = {x: 0, y: -1};
                    break;
                case 'ArrowDown':
                    if (dir.y !== -1) nextDir = {x: 0, y: 1};
                    break;
                case 'ArrowLeft':
                    if (dir.x !== 1) nextDir = {x: -1, y: 0};
                    break;
                case 'ArrowRight':
                    if (dir.x !== -1) nextDir = {x: 1, y: 0};
                    break;
            }
        });

        // Animation loop for smooth rendering
        function animate() {
            if (running) draw();
            requestAnimationFrame(animate);
        }
        animate();

        console.log('Heather Snake loaded - swipe to steer, tap to start');
    </script>
</body>
</html>
